name: Build Catalytic

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0 or v1.0.0-dev.1)'
        required: true
        type: string
  
  # 被 Catalytic 仓库触发
  repository_dispatch:
    types: [catalytic-release]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  # 🔥 新增：检查 tag 是否存在（只用于手动触发）
  check-tag:
    name: Check if tag exists
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check if tag exists in Catalytic repo
        id: check
        env:
          GH_TOKEN: ${{ secrets.CATALYTIC_PAT }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          # 检查 tag 是否存在
          if gh api repos/lzdev42/catalytic/git/ref/tags/$VERSION --silent 2>/dev/null; then
            echo "Tag $VERSION exists, will checkout tag"
            echo "ref=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "Tag $VERSION does not exist, will checkout main branch"
            echo "ref=main" >> $GITHUB_OUTPUT
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            platform: macos
            arch: AppleSilicon
            rust-target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: Intel
            rust-target: x86_64-apple-darwin
          
          # Linux
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
          
          # Windows
          - os: windows-latest
            platform: windows
            arch: x64
            rust-target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows
            arch: arm64
            rust-target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [check-tag]
    # 🔥 跳过 check-tag 的条件检查（如果是 repository_dispatch 就不需要 check-tag）
    if: always() && (github.event_name == 'repository_dispatch' || needs.check-tag.result == 'success')

    steps:
      # 🔥 根据触发方式决定 ref 和 version
      - name: Set build variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=${{ needs.check-tag.outputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ needs.check-tag.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # 🔥 Checkout Catalytic 仓库
      - name: Checkout Catalytic Repo
        uses: actions/checkout@v6
        with:
          repository: lzdev42/catalytic
          token: ${{ secrets.CATALYTIC_PAT }}
          ref: ${{ steps.vars.outputs.ref }}
          fetch-depth: 0

      # 🔥 如果是拉取 main，手动创建版本标记
      - name: Set version for main branch build
        if: steps.vars.outputs.ref == 'main'
        run: |
          echo "Building from main branch with version: ${{ steps.vars.outputs.version }}"
          # 可以在这里注入版本号到构建脚本，如果需要的话
        shell: bash

      # ============================================================
      # Environment Setup
      # ============================================================
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'jetbrains'
          cache: 'gradle'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}

      - name: Setup Rust Toolchain for Windows ARM64
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc
          rustup toolchain install stable-aarch64-pc-windows-msvc
          rustup default stable-aarch64-pc-windows-msvc
          echo "Toolchain status:"
          rustup show
          rustc --version
          cargo --version

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget

      # ============================================================
      # Build
      # ============================================================
      - name: Grant execute permission
        if: runner.os != 'Windows'
        run: chmod +x ./build_release.sh

      - name: Run Build Script (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          ./build_release.sh --output "${{ github.workspace }}/dist" --skip-sign

      - name: Run Build Script (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust-target }}
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          ./build_release.sh --output "${{ github.workspace }}/dist" --skip-sign

      - name: Package Windows ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/Catalytic `
            -DestinationPath dist/Catalytic-${{ matrix.arch }}.zip `
            -CompressionLevel Optimal `
            -Force

      # ============================================================
      # Upload Artifacts
      # ============================================================
      - name: Upload Build Artifact (macOS/Linux)
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: catalytic-${{ steps.vars.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.AppImage
          retention-days: 14

      - name: Upload Build Artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: catalytic-${{ steps.vars.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 14

  # ============================================================
  # 🔥 只有正式版（不含 dev）才发布 Release
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check-tag, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && !contains(needs.check-tag.outputs.version, 'dev')) ||
        (github.event_name == 'repository_dispatch' && !contains(github.event.client_payload.tag, 'dev'))
      )
    steps:
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ needs.check-tag.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Built from Catalytic repository
            Version: ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
